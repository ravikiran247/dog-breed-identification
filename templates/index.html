<!DOCTYPE html>
<html>
<head>
    <title>Dog Breed Identification</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f6d365, #fda085);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            text-align: center;
            width: 400px;
            animation: fadeIn 0.8s ease-in-out;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
            margin-bottom: 25px;
        }

        input[type="file"] {
            margin-bottom: 20px;
        }

        button {
            background: #ff7b54;
            border: none;
            padding: 12px 25px;
            color: white;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ff5722;
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🐾 Dog Breed Finder</h1>
    <p>Upload your cute dog photo and let our AI sniff out the breed!</p>

    <form action="/predict" method="POST" enctype="multipart/form-data">
        <input type="file" name="image" required><br>
        <button type="submit">Predict Breed 🐶</button>
    </form>
</div>

</body>
</html>
