<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            width: 450px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        img {
            width: 220px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .confidence-bar {
            background: #e0e0e0;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 15px;
        }

        .confidence-fill {
            height: 20px;
            background: #4e73df;
            width: {{ confidence }}%;
            transition: width 1s ease-in-out;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: white;
            background: #4e73df;
            padding: 10px 20px;
            border-radius: 8px;
        }

        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Prediction Result</h2>

    <img src="/{{ image_path }}">

    <h1>{{ prediction }}</h1>

    <p>Confidence: {{ confidence }}%</p>

    <div class="confidence-bar">
        <div class="confidence-fill"></div>
    </div>

    <a href="/">Try Another</a>
</div>

</body>
</html>
